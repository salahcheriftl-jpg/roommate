<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ROOMMATE (alpha)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<style>
  :root { --ink:#c4cdd2; --dim:#76838a; --line:#283036; --blood:#c3362c; --panel:#0a0d10; }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; color: #eee;
               font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  input { -webkit-user-select: text; user-select: text; }
  button { font-family: inherit; }
  /* the canvas is transparent and lets clicks pass through, so the YouTube player under it stays usable */
  canvas { position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none; }

  /* ---------- join screen ---------- */
  #join { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 12px; background: radial-gradient(ellipse at center, #0c1114, #040506 70%); color: #9fb0c0; z-index: 10; padding: 20px; text-align: center; }
  #join h1 { letter-spacing: 8px; font-weight: 400; margin: 0 0 6px; color: #c9d3d8; animation: flick 6s infinite; }
  #join h1 small { color: var(--blood); letter-spacing: 3px; font-size: 12px; }
  #join input, #join button { background: #0d1216; color: #b8c8d8; border: 1px solid var(--line); font-family: inherit; border-radius: 3px; }
  #join input { padding: 9px; text-align: center; font-size: 16px; letter-spacing: 4px; }
  #join button { padding: 9px 18px; cursor: pointer; letter-spacing: 2px; }
  #join button:hover { border-color: #6a2a26; color: #fff; }
  @keyframes flick { 0%,94%,100% { opacity: 1 } 95% { opacity: .35 } 96% { opacity: 1 } 97% { opacity: .5 } }

  /* ---------- overlays ---------- */
  #vig { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none;
         background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,.6) 100%),
                     repeating-linear-gradient(to bottom, rgba(0,0,0,.05) 0, rgba(0,0,0,.05) 1px, transparent 1px, transparent 3px); }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
           background: rgba(255,255,255,.8); z-index: 4; display: none; pointer-events: none; }
  .prompt { position: fixed; left: 50%; transform: translateX(-50%); padding: 4px 12px; font-size: 13px; letter-spacing: 1px;
            background: rgba(0,0,0,.65); border: 1px solid var(--line); border-radius: 3px; display: none; z-index: 4; pointer-events: none; }
  #prompt { bottom: 60px; } #prompt2 { bottom: 96px; } #prompt3 { bottom: 132px; }
  #help { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 4; pointer-events: none; font-size: 12px; color: var(--dim);
          letter-spacing: 1px; opacity: 0; transition: opacity 1.2s; text-align: center; width: 90%; }
  #help.show { opacity: 1; }

  /* ---------- top HUD ---------- */
  .bar { position: fixed; left: 0; right: 0; top: 0; display: none; gap: 8px; align-items: center; flex-wrap: wrap;
         padding: 8px 10px; z-index: 5; font-size: 13px; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .bar .grow { flex: 1; pointer-events: none; }
  .chip, .btn { padding: 5px 10px; border-radius: 3px; border: 1px solid var(--line); background: rgba(8,11,13,.8); color: var(--ink); font-size: 12px; letter-spacing: 1px; }
  .chip b { color: #e6ecef; font-weight: 700; }
  .btn { cursor: pointer; } .btn:hover { border-color: #6a2a26; color: #fff; }

  /* ---------- TV control deck ---------- */
  .deck { position: fixed; left: 50%; bottom: 14px; width: min(780px, calc(100% - 20px)); box-sizing: border-box;
          transform: translate(-50%, 18px); display: flex; flex-direction: column; gap: 9px; padding: 10px 14px 13px; z-index: 6;
          background: linear-gradient(rgba(14,18,21,.97), rgba(7,9,11,.97)); border: 1px solid #2b343a; border-radius: 6px;
          box-shadow: 0 12px 40px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.04), 0 0 28px rgba(130,24,18,.14);
          visibility: hidden; opacity: 0; transition: opacity .18s, transform .18s, visibility .18s; color: var(--ink); }
  .deck.show { visibility: visible; opacity: 1; transform: translate(-50%, 0); }
  .deck-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rec { width: 9px; height: 9px; border-radius: 50%; background: #3a1512; flex: none; }
  .deck.playing .rec { background: #e8291d; box-shadow: 0 0 8px #e8291d; animation: blink 1.4s infinite; }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: .25 } }
  .state { font-size: 12px; letter-spacing: 3px; color: #d4dce0; min-width: 78px; }
  .deck-title { flex: 1; min-width: 0; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seekwrap { display: flex; align-items: center; gap: 10px; }
  .t { font-size: 12px; color: #8d9aa1; min-width: 42px; font-variant-numeric: tabular-nums; }
  .t.r { text-align: right; }
  .deck-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .transport { display: flex; align-items: center; gap: 8px; }
  .deck button { cursor: pointer; color: #aab7be; background: transparent; border: 1px solid #28323a; border-radius: 4px; transition: background .12s, color .12s, border-color .12s; }
  .deck button:hover { background: #151c21; color: #fff; border-color: #3d4a52; }
  .deck button:active { transform: translateY(1px); }
  .deck svg { width: 20px; height: 20px; fill: currentColor; display: block; }
  .ibtn { width: 38px; height: 34px; display: flex; align-items: center; justify-content: center; gap: 1px; padding: 0; position: relative; }
  .ibtn small { position: absolute; bottom: 1px; right: 4px; font-size: 9px; letter-spacing: 0; }
  .ibtn.fwd svg { transform: scaleX(-1); } .ibtn.fwd small { right: auto; left: 4px; }
  .play { width: 48px; height: 48px; border-radius: 50% !important; display: flex; align-items: center; justify-content: center; padding: 0;
          color: #ff6a5e !important; background: #1b0f0e !important; border-color: #5c2420 !important; }
  .play:hover { box-shadow: 0 0 14px rgba(232,41,29,.4); background: #271312 !important; }
  .play svg { width: 22px; height: 22px; }
  .play .i-pause { display: none; } .play.on .i-pause { display: block; } .play.on .i-play { display: none; }
  .vol { display: flex; align-items: center; gap: 6px; }
  #vol { width: 92px; flex: none; }
  .vol .i-x { display: none; } .vol .muted .i-x { display: block; } .vol .muted .i-w { display: none; }
  .load { flex: 1; min-width: 190px; display: flex; gap: 6px; }
  .load input { flex: 1; min-width: 0; padding: 8px 9px; font-size: 13px; background: #05070a; color: #cfd8dc; border: 1px solid #28323a; border-radius: 4px; font-family: inherit; }
  .load input:focus { outline: none; border-color: #6a2a26; }
  .load button { padding: 0 14px; font-size: 12px; letter-spacing: 2px; }
  .deck.idle .transport, .deck.idle .seekwrap { opacity: .35; pointer-events: none; }
  .rng { -webkit-appearance: none; appearance: none; flex: 1; height: 20px; margin: 0; background: transparent; cursor: pointer; --p: 0%; --b: 0%; }
  .rng:focus { outline: none; }
  .rng::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
     background: linear-gradient(to right, #c3362c 0, #c3362c var(--p), #4a565e var(--p), #4a565e var(--b), #1a2125 var(--b)); }
  .rng::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: #e8ecee; border: 2px solid #c3362c; box-shadow: 0 0 6px rgba(195,54,44,.7); }
  .rng::-moz-range-track { height: 4px; border-radius: 2px;
     background: linear-gradient(to right, #c3362c 0, #c3362c var(--p), #4a565e var(--p), #4a565e var(--b), #1a2125 var(--b)); }
  .rng::-moz-range-thumb { width: 8px; height: 8px; border-radius: 50%; background: #e8ecee; border: 2px solid #c3362c; }

  /* ---------- chat ---------- */
  #chat { position: fixed; left: 12px; bottom: 14px; width: min(380px, calc(100% - 24px)); z-index: 7; display: none; flex-direction: column;
          gap: 6px; font-size: 13px; pointer-events: none; transition: bottom .2s; }
  body.deck-open #chat { bottom: 168px; }
  #chatLog { display: flex; flex-direction: column; justify-content: flex-end; max-height: 170px; overflow: hidden;
             -webkit-mask-image: linear-gradient(transparent, #000 35%); mask-image: linear-gradient(transparent, #000 35%); }
  .line { padding: 3px 8px; margin-top: 2px; color: #d3dade; background: rgba(0,0,0,.5); border-left: 2px solid #3a444a;
          text-shadow: 0 1px 2px #000; word-break: break-word; animation: fadeLine 18s forwards; }
  .line b { font-weight: 700; }
  .line.sys { color: var(--dim); font-style: italic; border-left-color: #6a2a26; }
  @keyframes fadeLine { 0%, 78% { opacity: 1 } 100% { opacity: 0 } }
  #chat.open #chatLog { max-height: 42vh; overflow-y: auto; pointer-events: auto; background: rgba(4,6,8,.7); -webkit-mask-image: none; mask-image: none; border: 1px solid var(--line); }
  #chat.open .line { animation: none; opacity: 1; }
  #chatForm { display: none; gap: 6px; pointer-events: auto; margin: 0; }
  #chat.open #chatForm { display: flex; }
  #chatInput { flex: 1; min-width: 0; padding: 8px 9px; font-size: 14px; background: rgba(5,7,10,.95); color: #dbe3e7; border: 1px solid #3a2624; border-radius: 3px; font-family: inherit; }
  #chatInput:focus { outline: none; border-color: #7a2d28; }
  #chatForm button { padding: 0 12px; font-size: 12px; letter-spacing: 2px; background: #1b0f0e; color: #ff7468; border: 1px solid #5c2420; border-radius: 3px; cursor: pointer; }

  /* ---------- touch controls ---------- */
  #joy { position: fixed; left: 22px; bottom: 26px; width: 124px; height: 124px; border-radius: 50%; z-index: 6; display: none;
         background: rgba(10,14,17,.45); border: 1px solid #36424a; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
          background: rgba(190,60,50,.55); border: 1px solid #7a2d28; pointer-events: none; }
  body.touch.in-room #joy { display: block; }
  body.deck-open #joy { display: none !important; }
  body.touch #chat { bottom: 164px; }
  body.touch.deck-open #chat { bottom: 176px; }
  body.touch input[type=text] { font-size: 16px; }

  #tv { position: fixed; left: 0; top: 0; width: 812px; height: 452px; transform-origin: 0 0; will-change: transform;
        z-index: 1; background: #000; display: none; }
  #tv iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>

<div id="join">
  <h1>ROOMMATE <small>alpha</small></h1>
  <input id="code" placeholder="ROOM CODE" maxlength="8" autocomplete="off" autocapitalize="characters">
  <button id="joinBtn">ENTER THE ROOM</button>
  <p style="opacity:.55;margin:4px 0;font-size:13px">Same code in two windows = same room</p>
  <p id="status" style="opacity:.9;margin:0;font-size:13px">Connecting to server...</p>
</div>

<div id="bar" class="bar">
  <span class="chip">ROOM <b id="roomLabel"></b></span>
  <button id="camMode" class="chip btn" title="Toggle camera (V)"></button>
  <span class="grow"></span>
  <button id="lightBtn" class="btn">Light: ON (F)</button>
  <button id="tvBtn" class="btn">TV (E)</button>
  <button id="sitBtn" class="btn">Sit (G)</button>
  <button id="chatBtn" class="btn">Chat (T)</button>
</div>
<div id="help"></div>

<div id="deck" class="deck idle" role="group" aria-label="TV controls">
  <div class="deck-top">
    <span class="rec"></span>
    <span id="deckState" class="state">NO TAPE</span>
    <span id="deckTitle" class="deck-title">Paste a YouTube link below to load a tape</span>
    <button id="closeBtn" class="ibtn" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6.4 4.9 12 10.6l5.6-5.7 1.5 1.5-5.7 5.6 5.7 5.6-1.5 1.5-5.6-5.7-5.6 5.7-1.5-1.5 5.7-5.6-5.7-5.6z"/></svg></button>
  </div>
  <div class="seekwrap">
    <span id="curLbl" class="t">0:00</span>
    <input type="range" id="seek" class="rng" min="0" max="1" step="0.1" value="0" aria-label="Seek">
    <span id="durLbl" class="t r">0:00</span>
  </div>
  <div class="deck-row">
    <div class="transport">
      <button id="backBtn" class="ibtn" title="Back 10s (Left = 5s)" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1L6.5 6 12 11V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><small>10</small></button>
      <button id="playBtn" class="play" title="Play / pause (Space)" aria-label="Play or pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg></button>
      <button id="fwdBtn" class="ibtn fwd" title="Forward 10s (Right = 5s)" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1L6.5 6 12 11V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><small>10</small></button>
    </div>
    <div class="vol">
      <button id="muteBtn" class="ibtn" title="Mute (M)" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path class="i-w" d="M15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.3 5.7a9 9 0 0 1 0 12.6l-1.4-1.4a7 7 0 0 0 0-9.8z"/><path class="i-x" d="m15 9.4 1.4-1.4 2.1 2.1 2.1-2.1L22 9.4l-2.1 2.1L22 13.6l-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></svg></button>
      <input type="range" id="vol" class="rng" min="0" max="100" step="1" value="80" aria-label="Volume">
    </div>
    <div class="load">
      <input type="text" id="url" placeholder="Paste a YouTube link" autocomplete="off">
      <button id="loadBtn">LOAD</button>
    </div>
  </div>
</div>

<div id="chat">
  <div id="chatLog" aria-live="polite"></div>
  <form id="chatForm" autocomplete="off">
    <input id="chatInput" type="text" maxlength="140" placeholder="Say something..." autocomplete="off">
    <button type="submit">SEND</button>
  </form>
</div>

<div id="joy"><div id="knob"></div></div>
<div id="vig"></div>
<div id="cross"></div>
<div id="prompt" class="prompt">E: TV controls</div>
<div id="prompt2" class="prompt">F: light switch (or click it)</div>
<div id="prompt3" class="prompt">G: sit down</div>
<div id="tv"><div id="yt"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status');
if (typeof THREE === 'undefined') {
  statusEl.textContent = 'Three.js failed to load (blocked or offline?)';
  throw new Error('THREE missing');
}
if (typeof io === 'undefined') {
  statusEl.textContent = 'Socket.IO not found. Open this page from the running Node server, not as a file or GitHub Pages.';
  throw new Error('io missing');
}
const socket = io();
socket.on('connect', () => (statusEl.textContent = 'Connected to server'));
socket.on('connect_error', () => (statusEl.textContent = 'Cannot reach server...'));
socket.on('disconnect', () => (statusEl.textContent = 'Disconnected from server'));

// ---------- state ----------
let joined = false, controlsOpen = false, locked = false;
let mode = 'third';              // 'third' | 'first'
let yaw = 0, pitch = -0.25;      // look angles (yaw 0 = facing the TV wall)
let camDist = 4.5;               // current camera distance behind the head (0 = first person)
const TP_DIST = 4.5, HEAD_Y = 1.3, SENS = 0.0022;

// ---------- 3D scene ----------
const scene = new THREE.Scene(); // no background: the canvas is transparent (page colour shows through)
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 100);
camera.rotation.order = 'YXZ';
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const promptEl = $('prompt'), prompt2El = $('prompt2');
function setShown(el, show) { const v = show ? 'block' : 'none'; if (el._d !== v) { el._d = v; el.style.display = v; } } // avoid redundant style writes
const _pt = { x: 0, y: 0, z: 0, rx: 0, ry: 0, dirty: true }; // last camera pose used to place the TV overlay
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: !IS_TOUCH, alpha: true, powerPreference: 'high-performance' });
} catch (err) {
  statusEl.textContent = 'WebGL is not available in this browser (try enabling hardware acceleration).';
  throw err;
}
renderer.setClearColor(0x000000, 0);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault(), false);

// =====================================================================
// ENVIRONMENT: padded psychiatric room (replaces the old basic room)
// =====================================================================
// adaptive quality: starts sharp, steps the resolution (and finally the bump maps) down if frames run slow
const padMats = [];
const DPR_MAX = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.25 : 1.5);
const QUALITY_DPR = [DPR_MAX, Math.min(DPR_MAX, 1), 0.8];
let quality = 0;
renderer.setPixelRatio(QUALITY_DPR[0]);
function setQuality(q) {
  quality = q;
  renderer.setPixelRatio(QUALITY_DPR[q]);
  renderer.setSize(innerWidth, innerHeight);
  if (q >= 2) padMats.forEach((m) => { m.bumpMap = null; m.needsUpdate = true; });
}
scene.fog = new THREE.FogExp2(0x1a222a, 0.028); // faint cold haze, deepens the far corners

// ---------- small procedural-texture toolkit ----------
function rng(seed) { // seeded random so the room looks the same every time
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c, repeat) {
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function blob(g, x, y, r, c0, c1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function speckle(g, w, h, n, R, a) {
  for (let i = 0; i < n; i++) {
    const v = R() < 0.5 ? 0 : 255, s = 1 + R() * 1.5;
    g.fillStyle = `rgba(${v},${v},${v},${a * R()})`;
    g.fillRect(R() * w, R() * h, s, s);
  }
}
function edgeShade(g, S, w, a) { // darken the borders of a square texture (the seams)
  const sides = [[0, 0, 0, w, 0, 0, S, w], [0, S, 0, S - w, 0, S - w, S, w], [0, 0, w, 0, 0, 0, w, S], [S, 0, S - w, 0, S - w, 0, w, S]];
  for (const [x0, y0, x1, y1, rx, ry, rw, rh] of sides) {
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(rx, ry, rw, rh);
  }
}
function strokeCurve(g, p, style, lw, dx, dy) {
  g.strokeStyle = style; g.lineWidth = lw; g.beginPath();
  g.moveTo(p[0] + dx, p[1] + dy); g.quadraticCurveTo(p[2] + dx, p[3] + dy, p[4] + dx, p[5] + dy); g.stroke();
}
const n2 = (x, z) => Math.sin(x * 3.1 + z * 2.3) * 0.5 + Math.sin(x * 7.7 - z * 5.1 + 1.3) * 0.25 + Math.sin(z * 9.3 + x * 1.7) * 0.15;
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

// one padded-square texture (colour + bump). Several seeds avoid obvious repetition.
function padTextures(seed) {
  const R = rng(seed), S = 512;
  const c = mkCanvas(S, S), g = c.getContext('2d');
  const hc = mkCanvas(S, S), h = hc.getContext('2d');
  g.fillStyle = '#bfc4c7'; g.fillRect(0, 0, S, S);
  blob(g, S / 2, S / 2, S * 0.78, 'rgba(236,239,240,1)', 'rgba(150,156,162,0)');
  h.fillStyle = '#767676'; h.fillRect(0, 0, S, S);
  blob(h, S / 2, S / 2, S * 0.7, 'rgba(255,255,255,0.85)', 'rgba(0,0,0,0)');
  // creases radiating from the corners/edges toward the middle
  for (let i = 0; i < 20; i++) {
    const a = R() * Math.PI * 2, r0 = S * 0.5 * (0.65 + R() * 0.35);
    const x0 = S / 2 + Math.cos(a) * r0, y0 = S / 2 + Math.sin(a) * r0;
    const a2 = a + (R() - 0.5) * 0.9, r1 = S * 0.16 * R();
    const x1 = S / 2 + Math.cos(a2) * r1, y1 = S / 2 + Math.sin(a2) * r1;
    const p = [x0, y0, (x0 + x1) / 2 + (R() - 0.5) * 70, (y0 + y1) / 2 + (R() - 0.5) * 70, x1, y1];
    const lw = 1 + R() * 3;
    strokeCurve(g, p, `rgba(88,94,100,${0.14 + R() * 0.2})`, lw, 0, 0);
    strokeCurve(g, p, 'rgba(255,255,255,0.16)', lw, 2, 2);
    strokeCurve(h, p, 'rgba(0,0,0,0.55)', lw + 1, 0, 0);
    strokeCurve(h, p, 'rgba(255,255,255,0.3)', lw, 3, 3);
  }
  // stains: old yellowing, grey-green damp
  const n = 5 + Math.floor(R() * 5);
  for (let i = 0; i < n; i++) {
    const col = R() < 0.6 ? '150,124,78' : '104,116,102';
    blob(g, R() * S, R() * S, 30 + R() * 90, `rgba(${col},${0.07 + R() * 0.16})`, `rgba(${col},0)`);
  }
  for (let i = 0; i < 3; i++) { // faint grimy streaks running down
    const x = R() * S, y = R() * S * 0.5, gr = g.createLinearGradient(0, y, 0, y + 220);
    gr.addColorStop(0, 'rgba(110,96,70,0.0)'); gr.addColorStop(0.3, 'rgba(110,96,70,0.10)'); gr.addColorStop(1, 'rgba(110,96,70,0)');
    g.fillStyle = gr; g.fillRect(x, y, 4 + R() * 9, 220);
  }
  speckle(g, S, S, 5000, R, 0.07);
  speckle(h, S, S, 5000, R, 0.12);
  edgeShade(g, S, 46, 0.5);   // seams between the pads
  edgeShade(h, S, 40, 0.85);
  return { map: canvasTex(c), bump: canvasTex(hc) };
}

function floorTexture() {
  const S = 2048, c = mkCanvas(S, S), g = c.getContext('2d'), R = rng(77);
  const n = 16, ts = S / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = 112 + R() * 30;
    g.fillStyle = `rgb(${v - 5},${v},${v + 7})`; g.fillRect(i * ts, j * ts, ts, ts);
    blob(g, i * ts + ts * (0.3 + R() * 0.4), j * ts + ts * (0.3 + R() * 0.4), ts * 0.7, 'rgba(255,255,255,0.05)', 'rgba(255,255,255,0)');
  }
  g.strokeStyle = 'rgba(22,26,30,0.9)'; g.lineWidth = 5; // grout
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * ts, 0); g.lineTo(i * ts, S); g.stroke();
    g.beginPath(); g.moveTo(0, i * ts); g.lineTo(S, i * ts); g.stroke();
  }
  for (let i = 0; i < 38; i++) { // stains
    const col = R() < 0.5 ? '20,18,14' : '110,92,58';
    blob(g, R() * S, R() * S, 40 + R() * 200, `rgba(${col},${0.07 + R() * 0.2})`, `rgba(${col},0)`);
  }
  g.lineWidth = 1;
  for (let i = 0; i < 120; i++) { // scuffs and scratches
    const x = R() * S, y = R() * S, a = R() * Math.PI * 2, l = 20 + R() * 120;
    g.strokeStyle = `rgba(${R() < 0.5 ? '255,255,255' : '0,0,0'},${0.05 + R() * 0.08})`;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let k = 0; k < 3; k++) { // hairline cracks
    let x = R() * S, y = R() * S; g.strokeStyle = 'rgba(8,10,12,0.6)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 14; s++) { x += (R() - 0.4) * 60; y += (R() - 0.3) * 60; g.lineTo(x, y); }
    g.stroke();
  }
  // floor drain (world x=2.4, z=-1.0)
  const dx = (2.4 + 6) / 12 * S, dy = (-1.0 + 6) / 12 * S;
  blob(g, dx, dy, 90, 'rgba(0,0,0,0.35)', 'rgba(0,0,0,0)');
  g.fillStyle = '#40464b'; g.beginPath(); g.arc(dx, dy, 40, 0, 7); g.fill();
  g.fillStyle = '#07090b'; g.beginPath(); g.arc(dx, dy, 32, 0, 7); g.fill();
  g.strokeStyle = '#575e64'; g.lineWidth = 4;
  for (let k = -24; k <= 24; k += 12) { g.beginPath(); g.moveTo(dx + k, dy - 28); g.lineTo(dx + k, dy + 28); g.stroke(); }
  speckle(g, S, S, 14000, R, 0.06);
  // darker toward the walls, like the real thing in a badly lit corridor
  const vg = g.createRadialGradient(S / 2, S / 2, S * 0.22, S / 2, S / 2, S * 0.74);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, S, S);
  edgeShade(g, S, 150, 0.5);
  return canvasTex(c);
}

function fabricTex(seed, base, stains) {
  const S = 256, R = rng(seed), c = mkCanvas(S, S), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, S, S);
  for (let i = 0; i < stains; i++) {
    const col = R() < 0.7 ? '150,125,80' : '90,95,95';
    blob(g, R() * S, R() * S, 20 + R() * 70, `rgba(${col},${0.08 + R() * 0.2})`, `rgba(${col},0)`);
  }
  g.strokeStyle = 'rgba(0,0,0,0.035)'; g.lineWidth = 1;
  for (let i = 0; i < S; i += 3) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, S); g.stroke(); }
  speckle(g, S, S, 1500, R, 0.08);
  return canvasTex(c);
}

function ceilingTexture() {
  const S = 512, R = rng(13), c = mkCanvas(S, S), g = c.getContext('2d');
  g.fillStyle = '#9aa1a8'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 10; i++) blob(g, R() * S, R() * S, 40 + R() * 120, `rgba(110,92,60,${0.08 + R() * 0.16})`, 'rgba(110,92,60,0)');
  speckle(g, S, S, 6000, R, 0.1);
  g.strokeStyle = 'rgba(30,34,38,0.8)'; g.lineWidth = 4; g.strokeRect(0, 0, S, S);
  return canvasTex(c, [4, 4]);
}

// ---------- padded wall squares (one InstancedMesh per texture variant) ----------
(function buildPads() {
  const geo = new THREE.PlaneGeometry(1, 1, 14, 14); // pillowy square: flush at the edges, puffed in the middle
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) * 2, y = p.getY(i) * 2;
    const e = (1 - Math.pow(Math.abs(x), 3.2)) * (1 - Math.pow(Math.abs(y), 3.2));
    p.setZ(i, 0.12 * Math.pow(Math.max(0, e), 0.55));
  }
  geo.computeVertexNormals();

  const R = rng(5), COLS = 12, PX = 11.7 / COLS, ROWS = 5, F = 5.85, OFF = 0.006;
  const VARIANTS = 3, mats = padMats, lists = [];
  for (let v = 0; v < VARIANTS; v++) {
    const t = padTextures(100 + v * 31);
    mats.push(new THREE.MeshStandardMaterial({ color: 0xffffff, map: t.map, bumpMap: t.bump, bumpScale: 2.6, roughness: 0.93, metalness: 0 }));
    lists.push([]);
  }
  const dummy = new THREE.Object3D(), col = new THREE.Color();

  function addTile(px, py, pz, ry, cornerDist) { // cornerDist: metres to the nearest real corner (Infinity = none)
    dummy.position.set(px, py, pz);
    dummy.rotation.set(0, ry, (R() - 0.5) * 0.03);
    dummy.scale.set(0.925 + R() * 0.05, 0.93 + R() * 0.05, 0.6 + R() * 0.8);
    if (R() < 0.07) { dummy.rotation.z += (R() - 0.5) * 0.12; dummy.position.y -= 0.025 + R() * 0.03; } // a sagging pad
    dummy.updateMatrix();
    // baked ambient occlusion + grime: darker in corners, near the floor and near the ceiling
    let k = 0.84 + R() * 0.16;
    k *= 1 - 0.5 * Math.exp(-cornerDist / 1.1);
    k *= 1 - 0.38 * Math.exp(-py / 0.9);
    k *= 1 - 0.3 * Math.exp(-(5 - py) / 0.8);
    if (py < 1) k *= 0.9;
    const tint = R() < 0.3 ? 0.88 : 1; // some pads have yellowed
    col.setRGB(k, k * (tint === 1 ? 0.995 : 0.96), k * (tint === 1 ? 1.0 : 0.86));
    lists[Math.floor(R() * VARIANTS)].push({ m: dummy.matrix.clone(), c: col.clone() });
  }

  for (let r = 0; r < ROWS; r++) {
    const y = r + 0.5;
    for (let i = 0; i < COLS; i++) {
      const s = -F + PX * (i + 0.5);
      // back wall (the bare plate behind the TV replaces the pads there)
      if (!(Math.abs(s) <= 2.6 && r < 4)) addTile(s, y, -F + OFF, 0, F - Math.abs(s));
      // side walls (the front corner is open, so only the back corner is dark)
      if (!(r === 3 && i === 4)) addTile(-F + OFF, y, s, Math.PI / 2, s + F); // (skipped where the window is)
      addTile(F - OFF, y, s, -Math.PI / 2, s + F);
    }
  }
  for (let v = 0; v < VARIANTS; v++) {
    const L = lists[v], im = new THREE.InstancedMesh(geo, mats[v], L.length);
    L.forEach((t, i) => { im.setMatrixAt(i, t.m); im.setColorAt(i, t.c); });
    im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true;
    im.frustumCulled = false; im.receiveShadow = true; // instanced meshes would otherwise be culled by the unit-square bounds
    scene.add(im);
  }
})();

let lightOn = true, lightSwitchT = -10, glow = 1, tubeGlow = 1, actx = null;
function clunk(on) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(150, t0); o.frequency.exponentialRampToValueAtTime(55, t0 + 0.08);
    g.gain.setValueAtTime(0.09, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.1);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.12);
    if (on) { // ballast buzz while the tubes catch
      const b = actx.createOscillator(), bg = actx.createGain();
      b.type = 'sawtooth'; b.frequency.value = 100; bg.gain.setValueAtTime(0.03, t0 + 0.05); bg.gain.exponentialRampToValueAtTime(0.001, t0 + 0.9);
      b.connect(bg); bg.connect(actx.destination); b.start(t0 + 0.05); b.stop(t0 + 0.95);
    }
  } catch (e) {}
}
function setLight(on, fromNet) {
  if (on === lightOn) return;
  lightOn = on; lightSwitchT = performance.now() / 1000;
  clunk(on);
  $('lightBtn').textContent = 'Light: ' + (on ? 'ON' : 'OFF') + ' (F)';
  if (!fromNet) socket.emit('light', on); // other players follow (needs a one-line relay on the server)
}

// ---------- per-frame: lights, flicker, props, dust, dead-TV static ----------
let nextFault = 6, faultEnd = 0, lastEnvT = 0;
const FOG_ON = new THREE.Color(0x1a222a), FOG_OFF = new THREE.Color(0x03060a);
function animateEnvironment(t) {
  const dt = Math.min(0.1, t - lastEnvT); lastEnvT = t;
  const since = t - lightSwitchT;

  // what the switch asks for, with fluorescent behaviour: stutters on, flickers out
  let level = lightOn ? 1 : 0;
  if (lightOn && since < 0.9) level = hash(Math.floor(since * 22) * 3.7 + 1) < since / 0.9 ? 1 : 0.06;
  else if (!lightOn && since < 0.18) level = hash(Math.floor(since * 40) + 5) < 0.5 ? 0.5 : 0;
  glow += (level - glow) * (1 - Math.exp(-dt * (level > glow ? 40 : 9)));
  tubeGlow += (level - tubeGlow) * (1 - Math.exp(-dt * (level > tubeGlow ? 40 : 3))); // tubes fade slower than the light they give

  // steady hum + slow brown-outs + occasional random fault (only while it's on)
  let k = 1;
  if (lightOn && since >= 0.9) {
    k += 0.025 * Math.sin(t * 2.1) + 0.012 * Math.sin(t * 13.7 + 1.3) + 0.01 * Math.sin(t * 50);
    const sag = Math.max(0, Math.sin(t * 0.31) * Math.sin(t * 0.17 + 1)); k *= 1 - 0.08 * sag;
    if (t > nextFault && t > faultEnd) { faultEnd = t + 0.2 + Math.random() * 0.6; nextFault = faultEnd + 5 + Math.random() * 12; }
    if (t < faultEnd) { const s = Math.floor(t * 26), h = hash(s); k *= h < 0.5 ? 0.05 + 0.25 * hash(s + 9) : 0.8 + 0.2 * hash(s + 3); }
  }
  const faulting = lightOn && t < faultEnd;
  const L = glow * k, Lc = Math.max(0, Math.min(1, L));
  lamp.intensity = 1.5 * Math.max(0, L);
  amb.intensity = 0.05 + 0.27 * Lc;
  hemi.intensity = 0.04 + 0.24 * Lc;
  const lv = Math.max(0, Math.min(1.05, tubeGlow * k));
  lightMat.color.setRGB(0.03 + 0.89 * lv, 0.035 + 0.925 * lv, 0.04 + 0.96 * lv);
  scene.fog.color.copy(FOG_OFF).lerp(FOG_ON, Math.min(1, glow));

  // moonlight drifting behind clouds
  moon.intensity = 1.7 * (0.82 + 0.18 * Math.sin(t * 0.13) * Math.sin(t * 0.07 + 2));
  // TV light + night-light get stronger when the room is dark
  tvLight.intensity = tvOn ? (0.4 + 1.0 * (1 - Math.min(1, glow))) * (0.92 + 0.08 * Math.random()) : 0;
  nightLight.intensity = 0.12 + 0.6 * (1 - Math.min(1, glow));
  // switch visuals
  swLever.rotation.z = lightOn ? 0.5 : -0.5;
  swLedMat.color.setHex(lightOn ? 0x300808 : 0xff3030);
  // exit sign hums
  const ex = 0.82 + 0.12 * Math.sin(t * 3) + (hash(Math.floor(t * 9)) < 0.03 ? -0.5 : 0);
  exitMat.color.setRGB(ex, ex, ex);
  // security camera follows you
  secWant.set(me.position.x, 1.1, me.position.z); secTgt.lerp(secWant, 0.03); secCam.lookAt(secTgt);
  ledMat.color.setHex((t % 2) < 0.15 ? 0xff2a2a : 0x4a0a0a);
  // the clock never moves forward; the second hand just twitches
  clockSec.userData.hand.rotation.z = -((30 + (Math.floor(t * 2) % 2) * 6) * Math.PI / 180);

  // dust drifts and fades with the light
  dust.material.opacity = 0.1 + 0.28 * Math.min(1, glow + 0.35 * (moon.intensity > 1 ? 1 : 0));
  const a = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST; i++) {
    a[i * 3 + 1] -= dt * (0.015 + 0.02 * ((i * 7) % 5) / 5);
    a[i * 3] += Math.sin(t * 0.3 + i) * dt * 0.02;
    if (a[i * 3 + 1] < 0) a[i * 3 + 1] = 4.8;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // "F: light switch" hint when you're near it
  setShown(prompt2El, joined && !controlsOpen && !chatOpen && Math.hypot(me.position.x - 5.6, me.position.z - SW_Z) < 2.4);

  updateTvStatic(t, faulting);
}

const PG = { // geometry + materials are shared by every player (cheap to draw)

const MT = {

// builds one complete body for a tone; a player carries both and shows the one its colour slot asks for
function buildTone(tone) {
  const isB = tone === 'black', M = MT[tone], rig = new THREE.Group();
  const glowBase = new THREE.Color(isB ? 0xffffff : 0xff2b2b);
  const glowMat = new THREE.MeshBasicMaterial({ color: glowBase.clone(), fog: false }); // the one thing that glows
  const add = (geo, mat, x, y, z, sx, sy, sz, parent) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); (parent || rig).add(m); return m;
  };
  // body: round bean with a belly patch
  add(PG.sph, M.body, 0, 0.62, 0, 0.34, 0.38, 0.31);
  add(PG.sph, M.belly, 0, 0.58, 0.14, 0.24, 0.27, 0.2);
  const bz = (x, y) => 0.14 + 0.2 * Math.sqrt(Math.max(0.02, 1 - (x / 0.24) * (x / 0.24) - ((y - 0.58) / 0.27) * ((y - 0.58) / 0.27))) + 0.004;
  for (let i = -3; i <= 3; i++) add(PG.box, isB ? M.thread : M.red, i * 0.06, 0.5, bz(i * 0.06, 0.5), 0.008, 0.07, 0.008); // sewn-up belly seam

  // big head on a pivot
  const head = new THREE.Group(); head.position.set(0, 1.2, 0); rig.add(head);
  add(PG.sph, M.body, 0, 0, 0, 0.5, 0.44, 0.46, head);
  const fz = (x, y) => 0.46 * Math.sqrt(Math.max(0.02, 1 - (x / 0.5) * (x / 0.5) - (y / 0.44) * (y / 0.44))) + 0.004; // face surface depth (y relative to head centre)
  const eyes = [], pupils = [], ears = [];
  const eye = (x, y, rx, ry, mat) => {
    const eg = new THREE.Group(); eg.position.set(x, y, fz(x, y) - 0.015); head.add(eg);
    add(PG.sph, mat, 0, 0, 0, rx, ry, 0.05, eg); eyes.push(eg); return eg;
  };

  if (isB) {
    // SHADE: huge white glowing eyes with tiny pupils (one bigger than the other), cheshire grin of needle teeth
    for (const [x, rx, ry] of [[-0.2, 0.13, 0.17], [0.2, 0.16, 0.2]]) {
      const eg = eye(x, 0.04, rx, ry, glowMat);
      const p = add(PG.sph, M.pupil, 0, -0.05, 0.04, 0.035, 0.05, 0.02, eg); p.userData.by = -0.05; pupils.push(p);
    }
    for (let i = -4; i <= 4; i++) { // top row
      const x = i * 0.055, y = -0.2 + Math.pow(x / 0.25, 2) * 0.1;
      add(PG.cone, M.tooth, x, y - 0.03, fz(x, y) + 0.004, 0.02, 0.06, 0.02, head).rotation.x = Math.PI;
    }
    for (let i = -4; i < 4; i++) { // bottom row, smaller
      const x = (i + 0.5) * 0.055, y = -0.26 + Math.pow(x / 0.25, 2) * 0.1;
      add(PG.cone, M.tooth, x, y + 0.03, fz(x, y) + 0.002, 0.015, 0.045, 0.015, head);
    }
    for (const sg of [-1, 1]) { // cat ears, red inside
      const e = new THREE.Group(); e.position.set(sg * 0.33, 0.4, 0); e.userData.base = sg * -0.32; e.rotation.z = e.userData.base; head.add(e); ears.push(e);
      add(PG.cone, M.body, 0, 0.14, 0, 0.17, 0.36, 0.17, e);
      add(PG.cone, M.earIn, 0, 0.1, 0.07, 0.09, 0.22, 0.05, e);
    }
    add(PG.box, M.crack, 0.12, 0.3, fz(0.12, 0.3) + 0.002, 0.007, 0.2, 0.004, head).rotation.z = 0.5;   // hairline cracks
    add(PG.box, M.crack, -0.2, 0.28, fz(-0.2, 0.28) + 0.002, 0.007, 0.15, 0.004, head).rotation.z = -0.3;
    add(PG.box, M.red, -0.2, -0.24, fz(-0.2, -0.24) + 0.003, 0.014, 0.2, 0.006, head);                 // a red tear running from the small eye
    add(PG.sph, M.red, -0.2, -0.35, fz(-0.2, -0.35) + 0.003, 0.02, 0.026, 0.008, head);
    // red scarf
    add(PG.ring, M.red, 0, 0.78, 0.0, 0.31, 0.28, 0.45).rotation.x = Math.PI / 2;
    add(PG.box, M.red, 0.18, 0.62, 0.29, 0.1, 0.28, 0.02).rotation.z = 0.2;
  } else {
    // PALE: one black button eye sewn on with red thread, one hollow eye with a tiny red glow, stitched smile, blush
    const bt = eye(-0.2, 0.04, 0.14, 0.17, M.hole);
    for (const a of [0.8, -0.8]) add(PG.box, M.red, 0, 0, 0.05, 0.2, 0.012, 0.01, bt).rotation.z = a;
    const he = eye(0.2, 0.04, 0.16, 0.21, M.hole);
    const p = add(PG.sph, glowMat, 0, -0.03, 0.045, 0.04, 0.05, 0.02, he); p.userData.by = -0.03; pupils.push(p);
    for (let i = -3; i <= 3; i++) { // tiny stitched mouth
      const x = i * 0.034, y = -0.2 + Math.pow(x / 0.1, 2) * 0.04;
      add(PG.box, M.thread, x, y, fz(x, y) + 0.002, 0.036, 0.011, 0.006, head).rotation.z = Math.atan(2 * x / 0.01 * 0.04);
      add(PG.box, M.thread, x, y, fz(x, y) + 0.004, 0.006, 0.07, 0.006, head);
    }
    for (const sg of [-1, 1]) { // blush with little stitches
      const x = sg * 0.33, y = -0.1;
      add(PG.sph, M.blush, x, y, fz(x, y) - 0.005, 0.09, 0.06, 0.02, head);
      for (let k = -1; k <= 1; k++) add(PG.box, M.thread, x + k * 0.03, y, fz(x, y) + 0.015, 0.005, 0.05, 0.004, head).rotation.z = 0.5;
    }
    // long bunny ears: the right one stands, the left one is broken and bandaged
    const er = new THREE.Group(); er.position.set(0.22, 0.38, 0); er.userData.base = -0.28; er.rotation.z = er.userData.base; head.add(er); ears.push(er);
    add(PG.sph, M.body, 0, 0.4, 0, 0.1, 0.42, 0.055, er); add(PG.sph, M.earIn, 0, 0.38, 0.03, 0.055, 0.3, 0.02, er);
    const el = new THREE.Group(); el.position.set(-0.22, 0.38, 0); el.userData.base = 0.3; el.rotation.z = el.userData.base; head.add(el); ears.push(el);
    add(PG.sph, M.body, 0, 0.22, 0, 0.1, 0.25, 0.055, el);
    const bend = new THREE.Group(); bend.position.set(0, 0.45, 0); bend.rotation.z = 1.15; el.add(bend);
    add(PG.sph, M.body, 0, 0.17, 0, 0.09, 0.21, 0.05, bend); add(PG.sph, M.earIn, 0, 0.15, 0.03, 0.05, 0.14, 0.02, bend);
    add(PG.box, M.band, 0, 0.45, 0, 0.17, 0.06, 0.09, el);
    // forehead bandage + hairline cracks
    add(PG.box, M.band, 0.16, 0.3, fz(0.16, 0.3) + 0.006, 0.2, 0.07, 0.012, head).rotation.z = 0.45;
    add(PG.sph, M.red, 0.2, 0.31, fz(0.2, 0.31) + 0.014, 0.025, 0.02, 0.004, head);
    add(PG.box, M.thread, -0.14, 0.31, fz(-0.14, 0.31) + 0.002, 0.007, 0.17, 0.004, head).rotation.z = -0.4;
    // black bow at the neck
    for (const sg of [-1, 1]) add(PG.cone, M.bow, sg * 0.1, 0.78, 0.29, 0.1, 0.14, 0.05).rotation.z = -sg * Math.PI / 2;
    add(PG.sph, M.bow, 0, 0.78, 0.3, 0.05, 0.05, 0.05);
  }

  // stubby arms and legs on pivots
  const mkArm = (x) => {
    const p = new THREE.Group(); p.position.set(x, 0.8, 0); rig.add(p);
    add(PG.sph, M.body, 0, -0.14, 0, 0.09, 0.2, 0.09, p); add(PG.sph, M.body, 0, -0.3, 0, 0.1, 0.1, 0.1, p);
    if (isB) for (const cx of [-0.04, 0, 0.04]) add(PG.cone, M.tooth, cx, -0.4, 0.01, 0.014, 0.06, 0.014, p).rotation.x = Math.PI; // tiny claws
    return p;
  };
  const armL = mkArm(-0.37), armR = mkArm(0.37); armL.rotation.z = -0.28; armR.rotation.z = 0.28;
  const mkLeg = (x) => {
    const p = new THREE.Group(); p.position.set(x, 0.35, 0); rig.add(p);
    add(PG.sph, M.body, 0, -0.14, 0, 0.11, 0.18, 0.11, p); add(PG.sph, M.body, 0, -0.3, 0.06, 0.13, 0.07, 0.18, p);
    return p;
  };
  const legL = mkLeg(-0.17), legR = mkLeg(0.17);
  const tail = new THREE.Group(); tail.position.set(0, 0.45, -0.3); rig.add(tail);
  if (isB) { add(PG.sph, M.body, 0, 0.12, -0.04, 0.06, 0.22, 0.06, tail); add(PG.sph, M.red, 0, 0.32, -0.06, 0.05, 0.05, 0.05, tail); }
  else add(PG.sph, M.body, 0, 0, -0.05, 0.14, 0.14, 0.14, tail); // round bobtail
  rig.visible = false;
  return { rig, head, armL, armR, legL, legR, eyes, pupils, ears, tail, glowMat, glowBase };
}

function setTone(g, tone) {
  const u = g.userData; if (u.tone === tone) return;
  if (u.P) u.P.rig.visible = false;
  u.tone = tone; u.P = u.tones[tone]; u.P.rig.visible = true;
  u.css = tone === 'white' ? '#f1efe8' : '#8d97a8';
}
function makePlayer() {
  const g = new THREE.Group();
  const tones = { black: buildTone('black'), white: buildTone('white') };
  g.add(tones.black.rig, tones.white.rig);
  const sh = new THREE.Mesh(PG.shadow, SHADOW_MAT); sh.rotation.x = -Math.PI / 2; sh.position.y = 0.012; g.add(sh);
  g.userData = { tones, P: null, tone: null, phase: Math.random() * 10, bubble: null, sit: 0, lastT: 0, css: '#8d97a8' };
  setTone(g, 'black');
  scene.add(g);
  return g;
}

function animateChar(g, moving, t, seated) {
  const u = g.userData, P = u.P; if (!P) return;
  const dts = Math.min(0.1, Math.max(0, t - (u.lastT || t))); u.lastT = t;
  u.sit += ((seated ? 1 : 0) - u.sit) * Math.min(1, dts * 7); // eases into / out of the chair
  const sit = u.sit, up = 1 - sit;
  if (seated) moving = false;
  const ph = t * 10 + u.phase, sw = moving ? Math.sin(ph) : 0, br = Math.sin(t * 1.6 + u.phase);
  const k = Math.floor(t * 5 + u.phase * 3), tw = hash(k + u.phase) > 0.95 ? 1 : 0;   // rare glitchy twitch
  P.rig.position.y = (moving ? Math.abs(Math.sin(ph)) * 0.07 : br * 0.012) * up + 0.19 * sit;
  P.rig.position.x = tw * (hash(k * 5.1) - 0.5) * 0.05;
  P.rig.rotation.z = (moving ? Math.sin(ph) * 0.08 : Math.sin(t * 0.4 + u.phase) * 0.02) * up;
  P.rig.rotation.x = moving ? 0.1 * up : 0;
  P.legL.rotation.x = sw * 0.8 * up - 1.45 * sit;
  P.legR.rotation.x = -sw * 0.8 * up - 1.45 * sit;
  const sway = Math.sin(t * 1.3 + u.phase) * 0.04;
  P.armL.rotation.x = -sw * 0.9 * up - 0.55 * sit;
  P.armR.rotation.x = sw * 0.9 * up - 0.55 * sit;
  P.armL.rotation.z = -0.28 - sway; P.armR.rotation.z = 0.28 + sway;
  // head: slow tilt, sometimes snaps sideways; looks up at the TV when seated
  P.head.rotation.z = 0.08 + Math.sin(t * 0.7 + u.phase) * 0.06 + tw * (hash(k * 1.7) - 0.5) * 0.7;
  P.head.rotation.y = Math.sin(t * 0.4 + u.phase) * (moving ? 0.1 : 0.3 - 0.2 * sit) + tw * (hash(k * 2.3) - 0.5) * 0.8;
  P.head.rotation.x = -0.1 * sit + Math.sin(t * 0.5 + u.phase) * 0.03;
  for (let i = 0; i < P.ears.length; i++) { const e = P.ears[i]; e.rotation.z = e.userData.base + Math.sin(t * 1.5 + u.phase + i * 1.7) * 0.05 + (moving ? Math.sin(ph) * 0.08 : 0); }
  P.tail.rotation.z = Math.sin(t * (moving ? 8 : 1.5) + u.phase) * 0.25;
  // slow blink; pupils wander; glow flickers
  const blink = ((t + u.phase) % 5.5) < 0.16 ? 0.05 : 1;
  for (const e of P.eyes) e.scale.y = blink;
  for (let i = 0; i < P.pupils.length; i++) { const p = P.pupils[i]; p.position.x = Math.sin(t * 1.1 + u.phase + i * 2) * 0.03; }
  const gl = 0.85 + 0.15 * Math.sin(t * 3 + u.phase) + (hash(Math.floor(t * 14) + u.phase * 7) < 0.04 ? -0.6 : 0);
  P.glowMat.color.copy(P.glowBase).multiplyScalar(Math.max(0.25, gl));
  if (u.bubble) {
    const age = t - u.bubbleT;
    if (age > 8) disposeBubble(g); else if (age > 6.8) u.bubble.material.opacity = Math.max(0, (8 - age) / 1.2);
  }
}

// ---------- speech bubbles over heads ----------
function disposeBubble(g) {
  const u = g.userData; if (!u.bubble) return;
  g.remove(u.bubble); u.bubble.material.map.dispose(); u.bubble.material.dispose(); u.bubble = null;
}
function showBubble(g, text) {
  const u = g.userData; if (!u.P) return;
  disposeBubble(g);
  const FONT = '600 24px "Courier New", ui-monospace, monospace', MAXW = 420, LH = 30, PAD = 16, TAIL = 12;
  const mctx = mkCanvas(8, 8).getContext('2d'); mctx.font = FONT;
  const lines = []; let cur = '';
  for (const w of text.replace(/(\S{22})/g, '$1 ').split(' ')) {
    const test = cur ? cur + ' ' + w : w;
    if (mctx.measureText(test).width > MAXW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].slice(0, -1) + '\u2026'; }
  let tw = 0; for (const l of lines) tw = Math.max(tw, mctx.measureText(l).width);
  const W = Math.ceil(tw) + PAD * 2, H = lines.length * LH + PAD * 2 + TAIL;
  const c = mkCanvas(W, H), x = c.getContext('2d');
  x.fillStyle = 'rgba(6,8,10,0.9)'; x.fillRect(0, 0, W, H - TAIL);
  x.strokeStyle = u.css; x.lineWidth = 2; x.strokeRect(1, 1, W - 2, H - TAIL - 2);
  x.fillStyle = 'rgba(6,8,10,0.9)'; x.beginPath(); x.moveTo(W / 2 - 9, H - TAIL - 1); x.lineTo(W / 2, H - 1); x.lineTo(W / 2 + 9, H - TAIL - 1); x.fill();
  x.font = FONT; x.textBaseline = 'top'; x.fillStyle = '#dbe5ea';
  lines.forEach((l, i) => x.fillText(l, PAD, PAD + i * LH));
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
  spr.center.set(0.5, 0); spr.scale.set(W / 150, H / 150, 1); spr.position.set(0, 2.2, 0);
  g.add(spr); u.bubble = spr; u.bubbleT = performance.now() / 1000;
}
function disposePlayer(g) { disposeBubble(g); g.userData.tones.black.glowMat.dispose(); g.userData.tones.white.glowMat.dispose(); scene.remove(g); }

const me = makePlayer();
me.position.set(0, 0, 3);

const remotes = {}; // id -> { mesh, x, z, ry }
const hueOf = (id) => Array.from(String(id)).reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
// colours: everyone in the room sorted by id, alternating black / white (both browsers agree without the server)
function refreshTones() {
  const mine = socket.id || '~me', ids = [mine].concat(Object.keys(remotes)).sort();
  setTone(me, ids.indexOf(mine) % 2 ? 'white' : 'black');
  for (const id in remotes) setTone(remotes[id].mesh, ids.indexOf(id) % 2 ? 'white' : 'black');
}
function getRemote(id) {

}

// ---------- camera ----------
const camRay = new THREE.Raycaster();
const pickRay = new THREE.Raycaster();
pickRay.far = 20;
const head = new THREE.Vector3(), dir = new THREE.Vector3(), back = new THREE.Vector3();

function clampPitch() {
  pitch = mode === 'third' ? Math.max(-1.0, Math.min(0.45, pitch)) : Math.max(-1.5, Math.min(1.5, pitch));
}
function updateCamLabel() {
  $('camMode').textContent = 'Camera: ' + (mode === 'third' ? 'Third person' : 'First person') + ' (V)';
}
function toggleCamera() {
  mode = mode === 'third' ? 'first' : 'third';
  clampPitch();
  updateCamLabel();
}

let lastH = [NaN, 0, 0, 0, 0, 0], camWantC = 0, camCollC = false; // the wall-collision ray is only re-cast when the view actually changed
function updateCamera(dt) {
  head.set(me.position.x, me.position.y + HEAD_Y + 0.19 * me.userData.sit, me.position.z);
  const cp = Math.cos(pitch);
  dir.set(-Math.sin(yaw) * cp, Math.sin(pitch), -Math.cos(yaw) * cp); // look direction

  const modeDist = mode === 'third' ? TP_DIST : 0;
  let want = modeDist, collided = false;
  if (modeDist > 0) { // keep the camera inside the room
    if (head.x !== lastH[0] || head.z !== lastH[1] || yaw !== lastH[2] || pitch !== lastH[3] || modeDist !== lastH[4] || head.y !== lastH[5]) {
      lastH = [head.x, head.z, yaw, pitch, modeDist, head.y];
      back.copy(dir).negate();
      camRay.set(head, back);
      camRay.far = modeDist + 0.3;
      const hit = camRay.intersectObjects(colliders, false)[0];
      camCollC = !!(hit && hit.distance - 0.25 < modeDist);
      camWantC = camCollC ? Math.max(0, hit.distance - 0.25) : modeDist;
    }
    want = camWantC; collided = camCollC;
  }
  if (collided && want < camDist) camDist = want;                     // snap in when a wall is behind
  else camDist += (want - camDist) * (1 - Math.exp(-dt * 10));        // otherwise glide

  camera.position.copy(head).addScaledVector(dir, -camDist);
  camera.rotation.set(pitch, yaw, 0);
  camera.updateMatrixWorld();
  me.visible = camDist > 0.9; // first person (or camera jammed against a wall): hide own body locally
}

// ---------- TV picking + controls ----------
const ndc = new THREE.Vector2();
function pickTV(ev) {
  if (ev && !locked) ndc.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  else ndc.set(0, 0); // looking straight ahead
  pickRay.setFromCamera(ndc, camera);
  return pickRay.intersectObjects(tvPick, false).length > 0;
}

const keys = {};
const joy = { x: 0, y: 0 };
const typing = (e) => e.target && e.target.tagName === 'INPUT' && e.target.type === 'text';
function deckKey(e, k) { // shortcuts while the TV controls are open
  if (e.target && e.target.type === 'range') return false;
  if (k === ' ') { e.preventDefault(); togglePlay(); return true; }
  if (k === 'arrowleft' || k === 'arrowright') { e.preventDefault(); if (playerReady) seekTo(player.getCurrentTime() + (k === 'arrowleft' ? -5 : 5)); return true; }
  if (k === 'arrowup' || k === 'arrowdown') {
    e.preventDefault(); volume = Math.max(0, Math.min(100, volume + (k === 'arrowup' ? 5 : -5))); muted = volume === 0; saveVol(); applyVolume(); return true;
  }
  if (k === 'm') { toggleMute(); return true; }
  return false;

// ---------- pin the YouTube player onto the 3D TV screen ----------
// Solves the perspective transform that maps the player rectangle onto the TV screen's
// four projected corners and applies it as a CSS matrix3d (the player stays fully clickable).
const TV_W = 812, TV_H = 452;

const tvCorners = [[-2.03, 3.53], [2.03, 3.53], [2.03, 1.27], [-2.03, 1.27]].map(([x, y]) => new THREE.Vector3(x, y, -5.54));
const tmpV = new THREE.Vector3();

function homography(src, dst) {
  const A = [];

    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u]);

  for (let c = 0; c < 8; c++) {
    let p = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]];

    for (let k = c; k < 9; k++) A[c][k] /= d;

  for (const id in remotes) {
    const r = remotes[id];
    const rm = Math.hypot(r.x - r.mesh.position.x, r.z - r.mesh.position.z) > 0.02;
    r.mesh.position.x += (r.x - r.mesh.position.x) * ra;
    r.mesh.position.z += (r.z - r.mesh.position.z) * ra;
    r.mesh.rotation.y += angDiff(r.mesh.rotation.y, r.ry) * ra;
    const sr = CHAIRS.some((c) => Math.hypot(r.mesh.position.x - c.x, r.mesh.position.z - (c.z + SEAT_DZ)) < 0.1);
    animateChar(r.mesh, rm && !sr, ts, sr);
  }
  animateChar(me, moving, ts, seatIdx >= 0);

  animateEnvironment(ts);
  updateCamera(dt);
  renderer.render(scene, camera);
  placeTV();
  if (now - lastPromptT > 120) { // the "E: TV controls" hint needs a ray cast: 8x a second is plenty
    lastPromptT = now;
    setShown(promptEl, joined && !controlsOpen && !chatOpen && pickTV());
    const nf = seatIdx >= 0 ? -2 : nearestFreeChair(), txt = seatIdx >= 0 ? 'Move to stand up   G: stand' : 'G: sit down';
    if (prompt3El._t !== txt) { prompt3El._t = txt; prompt3El.textContent = txt; }
    setShown(prompt3El, joined && !controlsOpen && !chatOpen && (seatIdx >= 0 || nf >= 0));
    const sl = seatIdx >= 0 ? 'Stand (G)' : 'Sit (G)'; if (sitBtn._t !== sl) { sitBtn._t = sl; sitBtn.textContent = sl; }
  }
}
updateCamLabel();
requestAnimationFrame(loop);

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  _pt.dirty = true;
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 250));
</script>
</body>
